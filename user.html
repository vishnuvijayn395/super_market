<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account | Kakde Supermarket</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="topbar">
    <div class="container topbar__inner">
      <span class="pill">
        <img src="assets/icons/map-pin.svg" class="icon-svg" alt="" /> Kakde Supermarket, Tumchya Gharajavalcha Vishwas
      </span>
      <span>
        <img src="assets/icons/clock.svg" class="icon-svg" alt="" /> Open 8:00 AM - 10:00 PM (All Days)
      </span>
    </div>
  </div>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">
          <img src="assets/icons/shopping-cart.svg" class="icon-svg" alt="" />
        </span>
        <span class="logo__text"><span class="logo__name">KAKDE</span><span class="logo__name2">SUPERMARKET</span></span>
      </a>
      <a class="btn-action" href="index.html">
        <img src="assets/icons/arrow-left.svg" class="icon-svg" alt="" /> Back to Supermarket
      </a>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 4rem; max-width: 650px;">
    <div style="background: white; border-radius: var(--radius-lg); padding: 2.5rem; border: 1px solid var(--border); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 72px; height: 72px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
          <img src="assets/icons/user.svg" class="icon-svg icon-svg-green" style="width: 36px; height: 36px;" alt="" />
        </div>
        <h2 id="userNameDisplay" style="font-family: var(--font-heading); font-size: 1.8rem;">Loading Profile...</h2>
        <p id="userEmailDisplay" style="color: var(--text-muted); font-size: 0.95rem;">Checking session credentials...</p>
        <div id="userRoleBadge" style="display: inline-block; margin-top: 0.5rem; background: var(--primary-light); color: var(--primary); font-weight: 700; padding: 0.25rem 0.85rem; border-radius: var(--radius-full); font-size: 0.8rem;">
          Customer Account
        </div>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        <a class="btn-primary" href="index.html" style="justify-content: center; text-align: center;">
          <img src="assets/icons/shopping-bag.svg" class="icon-svg" alt="" /> Continue Shopping
        </a>
        <a id="adminBtnLink" class="btn-secondary" href="admin.html" style="justify-content: center; text-align: center; background: var(--dark-slate); color: white; display: none;">
          <img src="assets/icons/wrench.svg" class="icon-svg" style="filter: brightness(0) invert(1);" alt="" /> Open Admin Dashboard
        </a>
        <button class="btn-action" id="userLogoutBtn" style="justify-content: center; border-color: var(--danger); color: var(--danger);">
          <img src="assets/icons/log-out.svg" class="icon-svg" style="filter: invert(36%) sepia(85%) saturate(2250%) hue-rotate(338deg) brightness(97%) contrast(93%);" alt="" /> Logout of Account
        </button>
      </div>
    </div>
  </main>

  <script>
    let csrfToken = "";
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch("/api/auth/me");
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated && data.user) {
            csrfToken = data.csrfToken || "";
            document.getElementById("userNameDisplay").textContent = data.user.name;
            document.getElementById("userEmailDisplay").textContent = data.user.email;
            document.getElementById("userRoleBadge").textContent = data.user.role === "admin" ? "Store Administrator" : "Customer Account";
            if (data.user.role === "admin") {
              document.getElementById("adminBtnLink").style.display = "flex";
            }
            return;
          }
        }
      } catch (e) {}
      window.location.href = "login.html";
    });

    document.getElementById("userLogoutBtn").addEventListener("click", async () => {
      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          headers: { "x-csrf-token": csrfToken }
        });
      } catch (e) {}
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
